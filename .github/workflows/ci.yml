name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Create development env
        run: npm run setup:env

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The application still carries one high advisory (Zod 3 memory
      # exhaustion). The gate is therefore set at critical until the Zod 4
      # upgrade is completed; high/moderate findings are reviewed, not ignored.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
