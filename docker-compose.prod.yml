# Production stack.
#
#   cp .env.production.example .env.production   # fill in the secrets
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# The backend image also contains the built web app, so there is one origin and
# the httpOnly auth cookies need no cross-site configuration. Put TLS in front
# of the published port (Caddy, nginx, or the hosting load balancer).
name: billstack

services:
  mysql:
    image: mysql:8.0
    container_name: billstack-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
      - --default-time-zone=+05:30
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.production}
      MYSQL_DATABASE: invoice_db
      MYSQL_USER: invoice
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.production}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: billstack-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: mysql://invoice:${MYSQL_PASSWORD}@mysql:3306/invoice_db
      FRONTEND_DIST: /app/frontend/dist
    ports:
      - '${APP_PORT:-4000}:4000'
    volumes:
      - storage_data:/app/var/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mysql_data:
  storage_data:
