# Development infrastructure.
#
#   npm run docker:up        → mysql + mailhog + minio only (recommended on Windows:
#                              run the apps natively with `npm run dev` for fast HMR)
#   docker compose --profile full up   → also builds and runs backend + frontend,
#                              which is how the Linux/Chromium PDF path gets verified
#
name: invoice-management-system

services:
  mysql:
    image: mysql:8.0
    container_name: ims-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
      - --default-time-zone=+05:30
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: invoice_db
      MYSQL_USER: invoice
      MYSQL_PASSWORD: invoice
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Catches every outgoing mail in development — nothing leaves the machine.
  # Web UI: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ims-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    logging:
      driver: none

  # S3-compatible storage so the S3 adapter is exercised long before production.
  # Console: http://localhost:9001 (minioadmin / minioadmin)
  minio:
    image: minio/minio:latest
    container_name: ims-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 6

  backend:
    profiles: ['full']
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: ims-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://invoice:invoice@mysql:3306/invoice_db
      SMTP_HOST: mailhog
      STORAGE_ENDPOINT: http://minio:9000
      FRONTEND_URL: http://localhost:5175
      PORT: '4000'
    ports:
      - '4000:4000'
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - storage_data:/app/var/storage

  frontend:
    profiles: ['full']
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: ims-frontend
    restart: unless-stopped
    ports:
      - '5175:5175'
    depends_on:
      - backend

volumes:
  mysql_data:
  minio_data:
  storage_data:
